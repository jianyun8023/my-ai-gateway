apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-ai-gateway
  labels:
    app: my-ai-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: my-ai-gateway
  template:
    metadata:
      labels:
        app: my-ai-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-my-ai-gateway
      containers:
        - name: my-ai-gateway
          image: ghcr.io/jianyun8023/my-ai-gateway:main
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: GATEWAY_LISTEN_ADDR
              value: 0.0.0.0:8787
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-secret
                  key: DATABASE_URL
            - name: GATEWAY_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-secret
                  key: GATEWAY_ADMIN_KEY
            - name: GATEWAY_CREDENTIAL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-secret
                  key: GATEWAY_CREDENTIAL_MASTER_KEY
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-provider-secret
                  key: GATEWAY_API_KEY
                  optional: true
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-provider-secret
                  key: KIMI_API_KEY
                  optional: true
            - name: MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-provider-secret
                  key: MINIMAX_API_KEY
                  optional: true
            - name: MINIMAX_API_KEY_2
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-provider-secret
                  key: MINIMAX_API_KEY_2
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-provider-secret
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: SILICONFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-provider-secret
                  key: SILICONFLOW_API_KEY
                  optional: true
            - name: B_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: my-ai-gateway-provider-secret
                  key: B_AI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: my-ai-gateway
  labels:
    app: my-ai-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8787
      targetPort: http
      protocol: TCP
  selector:
    app: my-ai-gateway
