[package]
name = "my-ai-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust AI gateway with multi-protocol ingress and account-aware routing"

[workspace]
members = ["crates/kimi-responses-adapter"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "derive"] }
tiktoken-rs = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
kimi-responses-adapter = { path = "crates/kimi-responses-adapter" }

[dev-dependencies]
