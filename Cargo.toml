[package]
name = "my-ai-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust AI gateway with multi-protocol ingress and account-aware routing"

[lints.rust]
dead_code = "deny"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "derive"] }
tiktoken-rs = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"

[features]
test-support = []

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "mock_provider_tests"
path = "tests/mock_provider_tests.rs"

[[test]]
name = "contract_tests"
path = "tests/contract_tests.rs"
required-features = ["test-support"]

[[example]]
name = "conformance-target"
path = "examples/conformance_target.rs"
required-features = ["test-support"]
