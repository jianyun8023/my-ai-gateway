name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4
        with:
          version: '2026.9.2'

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-

      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install locked Web dependencies
        run: mise run install

      - name: Validate repository configuration
        run: mise run config-check

      - name: Run static checks
        run: mise run lint

      - name: Build application
        run: mise run build

  test:
    name: Unit and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TEST_DATABASE_URL: postgres://gateway:gateway@127.0.0.1:5432/gateway_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4
        with:
          version: '2026.9.2'

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-

      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install locked Web dependencies
        run: mise run install

      - name: Run unit and contract tests
        run: mise run test

      - name: Run PostgreSQL integration tests
        run: mise run test-postgres
