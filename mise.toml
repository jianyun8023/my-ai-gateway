[tools]
rust = { version = "1.97.1", components = "rustfmt,clippy" }
node = "24.11.1"

[tasks.install]
description = "安装前端锁定依赖"
run = "npm --prefix web ci"

[tasks.config-check]
description = "校验仓库 JSON 配置和测试元数据"
run = "node -e \"const fs=require('node:fs'); for (const file of ['config.example.json','tests/live/provider-smoke.cases.json','tests/codex/cases.json','tests/tooling/versions.json','tests/coverage/capability-matrix.json','tests/coverage/test-result.schema.json','tests/conformance/config.json','tests/differential/cases.json','tests/load/scenarios.json']) JSON.parse(fs.readFileSync(file, 'utf8'))\""

[tasks.dev]
description = "启动 Rust 网关与前端开发环境"
run = '''
if [ ! -f .env ]; then
  echo ".env 不存在；请先复制 .env.example 并填写本机开发配置" >&2
  exit 1
fi
set -a
. ./.env
if [ -n "${GATEWAY_ENV_FILE:-}" ]; then
  case "$GATEWAY_ENV_FILE" in
    /*) gateway_env_file="$GATEWAY_ENV_FILE" ;;
    *) gateway_env_file="./$GATEWAY_ENV_FILE" ;;
  esac
  if [ ! -f "$gateway_env_file" ]; then
    echo "环境覆盖文件不存在：$GATEWAY_ENV_FILE" >&2
    exit 1
  fi
  . "$gateway_env_file"
fi
set +a
cargo run & gateway_pid=$!
trap 'kill $gateway_pid 2>/dev/null || true' EXIT INT TERM
npm --prefix web run dev
'''

[tasks.build]
description = "构建前端静态资源与 Rust 网关"
run = "npm --prefix web run build && cargo build"

[tasks.test]
description = "运行 Rust 与前端单元测试"
run = "cargo test --workspace --features test-support -- --test-threads=1 && npm --prefix web test && node --test scripts/live-provider-smoke.test.mjs scripts/codex-e2e-smoke.test.mjs scripts/conformance/conformance.test.mjs scripts/differential/differential.test.mjs scripts/load/load.test.mjs"

[tasks.test-live]
description = "显式运行真实 Provider 工具、搜索与 fallback smoke 测试"
run = "cargo build && node scripts/live-provider-smoke.mjs"

[tasks.test-codex-e2e]
description = "显式运行 Codex CLI 到 Gateway 的工具/搜索 E2E 测试"
run = "node scripts/codex-e2e-smoke.mjs"

[tasks.test-postgres]
description = "运行显式忽略的 PostgreSQL 集成测试"
run = '''
if [ -z "${TEST_DATABASE_URL:-}" ]; then
  echo "TEST_DATABASE_URL is required for PostgreSQL integration tests" >&2
  exit 1
fi
cargo test --workspace -- --ignored --test-threads=1
'''

[tasks.test-db]
description = "使用独立 PostgreSQL 测试库串行运行完整 Rust 回归"
run = '''
if [ ! -f .env.test ]; then
  echo ".env.test 不存在；请先复制 .env.test.example 并填写测试数据库连接串" >&2
  exit 1
fi
set -a
. ./.env.test
set +a
cargo test --workspace -- --include-ignored --test-threads=1
'''

[tasks.ops-retention-dry-run]
description = "预览四类历史数据的保留清理候选"
run = "cargo run -- ops retention-cleanup --dry-run"

[tasks.ops-control-plane-export]
description = "导出脱敏控制面 JSON（需要 DATABASE_URL）"
run = "cargo run -- ops control-plane-export --output control-plane.json"

[tasks.lint]
description = "运行 Rust 与前端静态检查"
run = "cargo fmt --all -- --check && cargo check --workspace && cargo clippy --all-targets --features test-support -- -D warnings && npm --prefix web run lint && npm --prefix web run typecheck"

[tasks.test-contract]
description = "运行 Mock Provider 基础设施和协议 Contract 测试（#115, #116, #117）"
run = '''
echo "=== test-contract: Mock Provider 基础设施 + 协议 Contract ==="
echo ""
echo "--- [1/2] MockProvider 自测（#115）---"
cargo test --test mock_provider_tests -- --test-threads=1
echo ""
echo "--- [2/2] 协议 Contract 测试（#116）---"
cargo test --test contract_tests --features test-support -- --test-threads=1
echo ""
echo "=== test-contract: 全部通过 ==="
'''

[tasks.test-conformance]
description = "运行 llmprobe + CompatCanary 外部合规扫描（#118）"
run = '''
echo "=== test-conformance: llmprobe + CompatCanary ==="
echo ""
echo "工具版本（来自 tests/tooling/versions.json）："
node -e "const v=JSON.parse(require('fs').readFileSync('tests/tooling/versions.json','utf8')); console.log('  llmprobe: '+v.llmprobe); console.log('  compatcanary: '+v.compatcanary)"
echo ""

failed=0

echo "--- [1/2] llmprobe conformance scan ---"
if node scripts/conformance/run-llmprobe.mjs; then
  echo "  ✓ llmprobe passed"
else
  echo "  ✗ llmprobe failed (exit $?)"
  failed=$((failed + 1))
fi

echo ""
echo "--- [2/2] CompatCanary probe scan ---"
if node scripts/conformance/run-compatcanary.mjs; then
  echo "  ✓ compatcanary passed"
else
  echo "  ✗ compatcanary failed (exit $?)"
  failed=$((failed + 1))
fi

echo ""
if [ "$failed" -gt 0 ]; then
  echo "=== test-conformance: $failed/2 子任务失败 ==="
  echo "  报告目录: target/test-reports/conformance/"
  exit 1
else
  echo "=== test-conformance: 全部通过 ==="
fi
'''

[tasks.test-sdk-smoke]
description = "运行 OpenAI/Anthropic 官方 SDK Smoke 测试（#118）"
run = '''
echo "=== test-sdk-smoke: Official SDK smoke tests ==="
echo ""

# Install SDK dependencies if needed
if [ ! -d scripts/conformance/sdk-smoke/node_modules ]; then
  echo "  Installing SDK dependencies…"
  npm --prefix scripts/conformance/sdk-smoke install --ignore-scripts 2>&1 | tail -1
fi

failed=0

echo "--- [1/2] OpenAI SDK smoke ---"
if node scripts/conformance/sdk-smoke/openai.mjs; then
  echo "  ✓ OpenAI SDK smoke passed"
else
  echo "  ✗ OpenAI SDK smoke failed (exit $?)"
  failed=$((failed + 1))
fi

echo ""
echo "--- [2/2] Anthropic SDK smoke ---"
if node scripts/conformance/sdk-smoke/anthropic.mjs; then
  echo "  ✓ Anthropic SDK smoke passed"
else
  echo "  ✗ Anthropic SDK smoke failed (exit $?)"
  failed=$((failed + 1))
fi

echo ""
if [ "$failed" -gt 0 ]; then
  echo "=== test-sdk-smoke: $failed/2 子任务失败 ==="
  echo "  报告目录: target/test-reports/conformance/sdk-smoke/"
  exit 1
else
  echo "=== test-sdk-smoke: 全部通过 ==="
fi
'''

[tasks.test-differential]
description = "运行 Direct vs Gateway 差分测试（#119）"
run = '''
echo "=== test-differential: Direct vs Gateway Differential ==="
echo ""

if [ "${DIFFERENTIAL_TESTS:-}" != "1" ]; then
  echo "DIFFERENTIAL_TESTS 未设置 — 运行离线自测"
  echo ""

  node --test scripts/differential/differential.test.mjs
  status=$?
  echo ""
  if [ "$status" -ne 0 ]; then
    echo "=== test-differential: 离线自测失败 ==="
    exit 1
  else
    echo "=== test-differential: 离线自测通过 ==="
  fi
  exit 0
fi

echo "DIFFERENTIAL_TESTS=1 — 运行真实 Provider 差分测试"
echo ""

# Forward CLI arguments (--provider, --model, --case, --include-error).
# 注意：mise 会把 `mise run test-differential -- <args>` 的参数原样追加到本脚本
# 最后一行，因此转发必须收敛在最后一行的 node 调用上（"$@" 对 mise 追加为空，
# 真正的参数来自 mise 的行尾追加）。
node scripts/differential/run.mjs "$@"
'''

[tasks.test-faults]
description = "运行确定性故障、SSE 生命周期与 attempt 归因回归（#120）"
run = "cargo test --features test-support --test contract_tests faults:: -- --test-threads=1 && cargo test --lib proxy::stream::tests -- --test-threads=1 && cargo test --lib api::runtime_usage_tests -- --test-threads=1"

[tasks.test-load]
description = "显式运行固定版本 k6/xk6-sse 的 Direct/Gateway 性能基线（#120）"
run = "node scripts/load/run.mjs"

[tasks.build-load-tools]
description = "构建固定版本 k6 与 xk6-sse（首次需要下载 Go 依赖）"
run = "node scripts/load/build-tools.mjs"

[tasks.test-all-offline]
description = "聚合离线门禁：无 Secret、无公网的完整协议验证"
run = '''
echo "=== test-all-offline: 聚合离线协议门禁 ==="
echo ""
echo "约束：不读取真实 Provider Secret，不访问公网模型 API。"
echo "包含：contract + faults + 本地可运行的 conformance/sdk smoke。"
echo ""

failed=0

echo "--- [1/6] test-contract ---"
if mise run test-contract; then
  echo "  ✓ test-contract passed"
else
  echo "  ✗ test-contract failed (exit $?)"
  failed=$((failed + 1))
fi

echo "--- [2/6] test-conformance ---"
if mise run test-conformance; then
  echo "  ✓ test-conformance passed"
else
  echo "  ✗ test-conformance failed (exit $?)"
  failed=$((failed + 1))
fi

echo "--- [3/6] test-sdk-smoke ---"
if mise run test-sdk-smoke; then
  echo "  ✓ test-sdk-smoke passed"
else
  echo "  ✗ test-sdk-smoke failed (exit $?)"
  failed=$((failed + 1))
fi

echo "--- [4/6] test-differential ---"
if DIFFERENTIAL_TESTS=0 mise run test-differential; then
  echo "  ✓ test-differential passed"
else
  echo "  ✗ test-differential failed (exit $?)"
  failed=$((failed + 1))
fi

echo "--- [5/6] test-faults ---"
if mise run test-faults; then
  echo "  ✓ test-faults passed"
else
  echo "  ✗ test-faults failed (exit $?)"
  failed=$((failed + 1))
fi

echo "--- [6/6] test-load ---"
if mise run test-load -- --target mock; then
  echo "  ✓ test-load passed"
else
  echo "  ✗ test-load failed (exit $?)"
  failed=$((failed + 1))
fi

echo ""
if [ "$failed" -gt 0 ]; then
  echo "=== test-all-offline: $failed/6 子任务失败 ==="
  exit 1
else
  echo "=== test-all-offline: 全部通过 ==="
fi
'''

[tasks.verify]
description = "部署前完整门禁：静态检查、构建、单元测试"
run = '''
mise run config-check
mise run lint
mise run build
mise run test
if [ -n "${TEST_DATABASE_URL:-}" ]; then
  mise run test-postgres
else
  echo "TEST_DATABASE_URL is not set; ignored PostgreSQL integration tests were skipped" >&2
fi
'''
