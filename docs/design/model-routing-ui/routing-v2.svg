<text x="260" y="108" class="t m s">模型与路由  /  deepseek-v4-flash</text><text x="260" y="145" class="t h">路由</text><text x="260" y="173" class="t m n">配置这个逻辑模型如何选择上游线路；能力不兼容的线路会在路由前自动过滤。</text><rect x="1395" y="124" width="165" height="42" rx="10" class="green"/><text x="1477" y="151" text-anchor="middle" class="t b n" fill="#fff">保存并发布</text>
