<rect x="250" y="265" width="1320" height="200" rx="16" class="card"/><text x="275" y="300" class="t b" font-size="18">路由策略</text><text x="275" y="325" class="t m s">常规模型路由使用简单策略；只有复杂条件才进入高级路由。</text>
<rect x="275" y="345" width="235" height="92" rx="12" class="gb"/><circle cx="297" cy="370" r="7" fill="#16a34a"/><text x="313" y="374" class="t b n">优先级 / 故障转移</text><text x="293" y="407" class="t m" font-size="11">主线路失败后按顺序回退</text><rect x="522" y="345" width="210" height="92" rx="12" class="soft"/><circle cx="544" cy="370" r="7" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="560" y="374" class="t b n">加权</text><text x="540" y="407" class="t m" font-size="11">按权重分配到多个线路</text><rect x="744" y="345" width="210" height="92" rx="12" class="soft"/><circle cx="766" cy="370" r="7" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="782" y="374" class="t b n">最低延迟</text><text x="762" y="407" class="t m" font-size="11">选择当前延迟最低线路</text><rect x="966" y="345" width="210" height="92" rx="12" class="soft"/><circle cx="988" cy="370" r="7" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="1004" y="374" class="t b n">最低成本</text><text x="984" y="407" class="t m" font-size="11">选择单位成本最低线路</text><rect x="1188" y="345" width="350" height="92" rx="12" fill="#fff7ed" stroke="#d97706"/><circle cx="1210" cy="370" r="7" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="1226" y="374" class="t b n" fill="#d97706">自定义高级路由</text><text x="1206" y="407" class="t m" font-size="11">条件 / A/B / 预算 / 多级回退 → Route Builder</text>
<rect x="250" y="490" width="820" height="445" rx="16" class="card"/><text x="275" y="525" class="t b" font-size="18">上游线路 Targets</text><text x="275" y="550" class="t m s">按顺序尝试。内部 Priority 数值不暴露给普通配置。</text>
<circle cx="295" cy="620" r="18" fill="#16a34a"/><text x="295" y="626" text-anchor="middle" class="t b s" fill="#fff">1</text><rect x="330" y="585" width="700" height="78" rx="12" class="gb"/><text x="350" y="612" class="t b s" fill="#16a34a">主线路</text><text x="350" y="637" class="t b n">deepseek-main</text><text x="520" y="637" class="t m s">deepseek-v4-flash</text><rect x="730" y="608" width="82" height="30" rx="15" class="gb"/><text x="771" y="628" text-anchor="middle" class="t b s" fill="#16a34a">健康</text><text x="840" y="633" class="t m s">320 ms</text><rect x="925" y="604" width="80" height="36" rx="9" class="card"/><text x="965" y="627" text-anchor="middle" class="t b s">编辑</text>
<line x1="295" y1="638" x2="295" y2="685" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><circle cx="295" cy="720" r="18" fill="#2563eb"/><text x="295" y="726" text-anchor="middle" class="t b s" fill="#fff">2</text><rect x="330" y="685" width="700" height="78" rx="12" class="bb"/><text x="350" y="712" class="t b s" fill="#2563eb">备用线路 1</text><text x="350" y="737" class="t b n">bai-main</text><text x="520" y="737" class="t m s">deepseek-v4-flash</text><rect x="730" y="708" width="82" height="30" rx="15" class="gb"/><text x="771" y="728" text-anchor="middle" class="t b s" fill="#16a34a">健康</text><text x="840" y="733" class="t m s">480 ms</text><rect x="925" y="704" width="80" height="36" rx="9" class="card"/><text x="965" y="727" text-anchor="middle" class="t b s">编辑</text><rect x="330" y="790" width="700" height="54" rx="10" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 5"/><text x="680" y="823" text-anchor="middle" class="t m b s">＋ 添加备用线路</text>
<text x="275" y="885" class="t b n">模型回退 Model Fallback</text><text x="510" y="885" class="t m" font-size="12">所有 Provider / Source 都失败后，再切换到另一个逻辑模型。</text><rect x="275" y="900" width="755" height="28" rx="8" class="soft"/><text x="295" y="919" class="t m b" font-size="12">未配置   ＋ 添加模型回退</text>
<rect x="1090" y="490" width="480" height="445" rx="16" class="card"/><text x="1115" y="525" class="t b" font-size="18">路由前能力过滤</text><text x="1115" y="550" class="t m s">先筛掉不支持当前请求能力的 Targets，再执行路由策略。</text><text x="1115" y="590" class="t m s">协议</text><rect x="1245" y="568" width="110" height="30" rx="15" class="gb"/><text x="1300" y="588" text-anchor="middle" class="t b s" fill="#16a34a">Messages</text><text x="1390" y="590" class="t b n" fill="#16a34a">✓</text><text x="1115" y="638" class="t m s">Vision</text><rect x="1245" y="616" width="110" height="30" rx="15" class="bb"/><text x="1300" y="636" text-anchor="middle" class="t b s" fill="#2563eb">需要</text><text x="1390" y="638" class="t b n" fill="#16a34a">✓</text><text x="1115" y="686" class="t m s">Tools</text><rect x="1245" y="664" width="110" height="30" rx="15" class="pb"/><text x="1300" y="684" text-anchor="middle" class="t b s" fill="#7c3aed">需要</text><text x="1390" y="686" class="t b n" fill="#16a34a">✓</text><text x="1115" y="734" class="t m s">Streaming</text><rect x="1245" y="712" width="110" height="30" rx="15" class="soft"/><text x="1300" y="732" text-anchor="middle" class="t b s">需要</text><text x="1390" y="734" class="t b n" fill="#16a34a">✓</text><line x1="1115" y1="770" x2="1540" y2="770" class="line"/><text x="1115" y="800" class="t b n">可用 Targets</text><circle cx="1125" cy="835" r="6" fill="#16a34a"/><text x="1142" y="840" class="t b s">deepseek-main</text><rect x="1395" y="820" width="105" height="30" rx="15" class="gb"/><text x="1447" y="840" text-anchor="middle" class="t b s" fill="#16a34a">兼容</text><circle cx="1125" cy="875" r="6" fill="#16a34a"/><text x="1142" y="880" class="t b s">bai-main</text><rect x="1395" y="860" width="105" height="30" rx="15" class="gb"/><text x="1447" y="880" text-anchor="middle" class="t b s" fill="#16a34a">兼容</text><text x="1115" y="917" class="t m b" font-size="12">最终执行：优先级 / 故障转移</text>
