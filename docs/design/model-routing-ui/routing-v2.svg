<style>.t{font-family:Inter,'PingFang SC','Microsoft YaHei',Arial,sans-serif;fill:#0f172a}.m{fill:#64748b}.b{font-weight:700}.s{font-size:13px}.n{font-size:15px}.h{font-size:30px;font-weight:750}.card{fill:#fff;stroke:#e2e8f0}.soft{fill:#f8fafc;stroke:#e2e8f0}.gb{fill:#ecfdf3;stroke:#16a34a}.bb{fill:#eff6ff;stroke:#2563eb}.pb{fill:#f5f3ff;stroke:#7c3aed}.green{fill:#16a34a}.line{stroke:#e2e8f0;stroke-width:1}</style>
<rect width="1600" height="1000" fill="#f6f8fb"/><rect width="230" height="1000" fill="#fff"/><rect x="20" y="20" width="36" height="36" rx="8" class="green"/><text x="38" y="44" text-anchor="middle" class="t b" fill="#fff">AG</text><text x="68" y="43" class="t b" font-size="17">AI Gateway</text><text x="176" y="43" class="t m" font-size="12">v0.3</text><line x1="0" y1="70" x2="230" y2="70" class="line"/><text x="20" y="112" class="t m s">监控</text><text x="52" y="145" class="t m n">总览</text><text x="52" y="185" class="t m n">用量分析</text><text x="52" y="225" class="t m n">请求事件</text><text x="52" y="265" class="t m n">运行事件</text><text x="20" y="315" class="t m s">配置</text><text x="52" y="350" class="t m n">来源管理</text><text x="52" y="390" class="t m n">模型发现</text><rect x="10" y="402" width="210" height="38" rx="9" fill="#ecfdf3"/><text x="52" y="428" class="t b n" fill="#16a34a">模型与路由</text><text x="52" y="470" class="t m n">能力矩阵</text><text x="20" y="530" class="t m s">系统</text><text x="52" y="566" class="t m n">系统设置</text>
