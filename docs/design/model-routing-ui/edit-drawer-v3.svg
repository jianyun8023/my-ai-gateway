<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>
text{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#111827}.muted{fill:#6b7280}.green{fill:#16a34a}.blue{fill:#2563eb}.h1{font-size:30px;font-weight:760}.h2{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.xs{font-size:10px}.bold{font-weight:650}.card{fill:#fff;stroke:#e5e7eb}.soft{fill:#f8fafc}.gbg{fill:#ecfdf3;stroke:#bbf7d0}.bbg{fill:#eff6ff;stroke:#bfdbfe}.line{stroke:#e5e7eb}.btn{fill:#fff;stroke:#e5e7eb}.primary{fill:#16a34a;stroke:#16a34a}.white{fill:#fff}
</style>
<rect width="1600" height="1000" fill="#f5f7fa"/>
<!-- base console -->
<rect width="228" height="1000" fill="#fff"/><rect x="20" y="18" width="38" height="38" rx="9" fill="#16a34a"/><text x="39" y="43" class="white small bold" text-anchor="middle">AG</text><text x="72" y="42" class="h2">AI Gateway</text><text x="174" y="42" class="muted small">v0.3</text><path d="M0 70H228" class="line"/><text x="20" y="112" class="muted small bold">监控</text><text x="50" y="146" class="muted body">总览</text><text x="50" y="185" class="muted body">用量分析</text><text x="50" y="224" class="muted body">请求事件</text><text x="50" y="263" class="muted body">运行事件</text><text x="20" y="313" class="muted small bold">配置</text><text x="50" y="348" class="muted body">来源管理</text><text x="50" y="388" class="muted body">模型发现</text><rect x="10" y="401" width="208" height="38" rx="8" fill="#ecfdf3"/><circle cx="31" cy="420" r="5" fill="#16a34a"/><text x="50" y="428" class="green body bold">模型与路由</text><text x="50" y="468" class="muted body">能力矩阵</text><text x="20" y="525" class="muted small bold">系统</text><text x="50" y="562" class="muted body">系统设置</text>
<rect x="228" width="1372" height="70" fill="#fff"/><path d="M228 70H1600" class="line"/><rect x="805" y="18" width="238" height="34" rx="8" class="soft"/><text x="924" y="40" class="muted small" text-anchor="middle">https://ai-gateway.pvelab.top</text><text x="1060" y="40" class="small bold">Admin Key</text><rect x="1140" y="18" width="155" height="34" rx="8" class="soft" stroke="#e5e7eb"/><text x="1217" y="40" class="muted small" text-anchor="middle">GATEWAY_ADMIN_KEY</text><rect x="1305" y="18" width="58" height="34" rx="8" class="btn"/><text x="1334" y="40" class="small bold" text-anchor="middle">应用</text><text x="1470" y="41" class="body bold">中文</text><text x="1558" y="42" class="muted h2">↻</text>
<text x="260" y="122" class="h1">模型与路由</text><text x="260" y="151" class="muted body">直接查看每个逻辑模型当前走哪条线路，失败后回退到哪里。</text><rect x="250" y="190" width="1320" height="755" rx="16" class="card"/><rect x="270" y="212" width="430" height="42" rx="9" class="soft" stroke="#e5e7eb"/><text x="288" y="239" class="muted body">⌕  搜索模型名称...</text><rect x="270" y="275" width="1280" height="46" rx="8" class="soft"/><text x="295" y="304" class="muted small bold">模型</text><text x="620" y="304" class="muted small bold">协议</text><text x="845" y="304" class="muted small bold">线路</text><text x="1360" y="304" class="muted small bold">状态</text>
