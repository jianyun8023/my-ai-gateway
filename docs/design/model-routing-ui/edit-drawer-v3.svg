<path d="M980 958H1600" class="line"/><rect x="1370" y="972" width="84" height="40" rx="9" class="btn"/><text x="1412" y="998" class="body bold" text-anchor="middle">取消</text><rect x="1466" y="972" width="104" height="40" rx="9" class="primary"/><text x="1518" y="998" class="white body bold" text-anchor="middle">保存</text>
