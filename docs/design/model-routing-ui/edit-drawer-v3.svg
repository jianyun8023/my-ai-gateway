<!-- dim -->
<rect x="228" y="70" width="1372" height="930" fill="#0f172a" opacity=".16"/>
<!-- drawer -->
<rect x="980" y="70" width="620" height="930" fill="#fff"/><path d="M980 70V1000" class="line"/><text x="1010" y="112" font-size="24" font-weight="750">编辑模型</text><text x="1010" y="139" class="muted small">只维护模型启用状态、线路顺序和请求参数。</text><text x="1554" y="115" class="muted" font-size="26" text-anchor="middle">×</text><path d="M980 160H1600" class="line"/>
<!-- basic -->
<text x="1010" y="198" class="h2">基本信息</text><text x="1010" y="230" class="muted small bold">逻辑模型名称</text><rect x="1010" y="244" width="440" height="42" rx="8" class="soft" stroke="#e5e7eb"/><text x="1026" y="270" class="body bold">deepseek-v4-flash</text><text x="1480" y="230" class="muted small bold">状态</text><rect x="1478" y="244" width="82" height="30" rx="15" class="gbg"/><text x="1519" y="264" class="green small bold" text-anchor="middle">已启用</text>
<!-- ordered routes -->
<text x="1010" y="336" class="h2">上游线路</text><text x="1010" y="359" class="muted small">按顺序尝试；拖动即可调整主备顺序。</text>
<rect x="1010" y="394" width="560" height="96" rx="11" class="card"/><text x="1028" y="427" class="muted body bold">⋮⋮</text><circle cx="1068" cy="425" r="15" fill="#16a34a"/><text x="1068" y="430" class="white small bold" text-anchor="middle">1</text><text x="1095" y="423" class="green small bold">主线路</text><text x="1095" y="449" class="body bold">deepseek-main</text><text x="1280" y="449" class="muted small">/ deepseek-v4-flash</text><circle cx="1464" cy="443" r="5" fill="#16a34a"/><text x="1477" y="447" class="green small bold">健康</text><text x="1530" y="448" class="muted h2" text-anchor="middle">⋯</text>
<rect x="1010" y="510" width="560" height="96" rx="11" class="card"/><text x="1028" y="543" class="muted body bold">⋮⋮</text><circle cx="1068" cy="541" r="15" fill="#2563eb"/><text x="1068" y="546" class="white small bold" text-anchor="middle">2</text><text x="1095" y="539" class="blue small bold">备用线路</text><text x="1095" y="565" class="body bold">bai-main</text><text x="1280" y="565" class="muted small">/ deepseek-v4-flash</text><circle cx="1464" cy="559" r="5" fill="#16a34a"/><text x="1477" y="563" class="green small bold">健康</text><text x="1530" y="564" class="muted h2" text-anchor="middle">⋯</text>
<rect x="1010" y="624" width="560" height="44" rx="9" class="btn"/><text x="1290" y="651" class="muted small bold" text-anchor="middle">＋ 添加备用线路</text>
<!-- request settings -->
<text x="1010" y="716" class="h2">请求设置</text><text x="1010" y="748" class="muted small bold">超时</text><rect x="1010" y="762" width="170" height="42" rx="8" class="btn"/><text x="1026" y="788" class="body bold">60,000 ms</text><text x="1210" y="748" class="muted small bold">重试次数</text><rect x="1210" y="762" width="150" height="42" rx="8" class="btn"/><text x="1226" y="788" class="body bold">2 次</text>
<!-- protocol readonly -->
<text x="1010" y="844" class="h2">支持协议</text><rect x="1010" y="861" width="154" height="30" rx="15" class="soft" stroke="#e5e7eb"/><text x="1087" y="881" class="small bold" text-anchor="middle">Chat Completions</text><rect x="1174" y="861" width="104" height="30" rx="15" class="soft" stroke="#e5e7eb"/><text x="1226" y="881" class="small bold" text-anchor="middle">Messages</text><rect x="1288" y="861" width="112" height="30" rx="15" class="soft" stroke="#e5e7eb"/><text x="1344" y="881" class="small bold" text-anchor="middle">Responses</text><rect x="1412" y="861" width="72" height="30" rx="15" class="gbg"/><text x="1448" y="881" class="green small bold" text-anchor="middle">原生</text>
<!-- advanced collapsed -->
<rect x="1010" y="908" width="560" height="38" rx="8" class="soft" stroke="#e5e7eb"/><text x="1025" y="933" class="muted small bold">高级信息</text><text x="1545" y="933" class="muted xs" text-anchor="end">Binding / RouteRule / ID 仅用于诊断  ›</text>
